email.footer=You received this email because you have a NodeMor Academy account. nodemor.io
email.ACCOUNT_SUSPENDED.subject=Your NodeMor Academy account is suspended
email.ACCOUNT_SUSPENDED.body=Hello {{name}},\n\nYour account has been suspended.\nReason: {{reason}}\n\nReply to this email or contact support if you think this is a mistake.
email.ANNOUNCEMENT.subject={{className}}: {{title}}
email.ANNOUNCEMENT.body=Hello {{name}},\n\nYour teacher posted an announcement in {{className}}.\n\n{{title}}\n{{body}}
email.ASSIGNMENT_DUE.subject=Due soon: {{title}}
email.ASSIGNMENT_DUE.body=Hello {{name}},\n\nThe assignment {{title}} in {{className}} is due at {{due}}, and you have not submitted it yet.
email.ASSIGNMENT_GRADED.subject=Your work was marked: {{title}}
email.ASSIGNMENT_GRADED.body=Hello {{name}},\n\nYour submission for {{title}} received {{marks}} out of {{max}}. Open NodeMor Academy to read your teacher's feedback.
email.ENROLLMENT_APPROVED.subject=Your request for {{className}} was approved
email.ENROLLMENT_APPROVED.body=Hello {{name}},\n\nYour teacher approved your request. You can now open {{className}} on NodeMor Academy.
email.ENROLLMENT_CONFIRMED.subject=You joined {{className}}
email.ENROLLMENT_CONFIRMED.body=Hello {{name}},\n\nYou are now enrolled in {{className}}. Open your classes on NodeMor Academy to see live classes, lessons and notes.
email.ENROLLMENT_REJECTED.subject=Update on your request for {{className}}
email.ENROLLMENT_REJECTED.body=Hello {{name}},\n\nYour request to join {{className}} was not approved. You can browse other classes on NodeMor Academy.
email.ENROLLMENT_REQUEST.subject=New join request for {{className}}
email.ENROLLMENT_REQUEST.body=Hello {{name}},\n\n{{studentName}} asked to join {{className}}. Open the class on NodeMor Academy to approve or decline.
email.NEW_ASSIGNMENT.subject=New assignment: {{title}}
email.NEW_ASSIGNMENT.body=Hello {{name}},\n\nA new assignment was posted in {{className}}.\n{{title}}\nDue: {{due}}
email.NEW_LESSON.subject=New lesson in {{className}}
email.NEW_LESSON.body=Hello {{name}},\n\nA new recorded lesson is ready: {{title}}. Watch it on NodeMor Academy.
email.NEW_MATERIAL.subject=New notes in {{className}}
email.NEW_MATERIAL.body=Hello {{name}},\n\nYour teacher added new notes: {{title}}. Open them on NodeMor Academy.
email.NEW_QUIZ.subject=New quiz: {{title}}
email.NEW_QUIZ.body=Hello {{name}},\n\nA new quiz is available in {{className}}: {{title}}.
email.PASSWORD_CHANGED.subject=Your password was changed
email.PASSWORD_CHANGED.body=Hello {{name}},\n\nThe password for your NodeMor Academy account was just changed. All other devices were signed out.\n\nIf this was not you, reset your password immediately and contact support.
email.PAYMENT_CONFIRMED.subject=Payment received for {{className}}
email.PAYMENT_CONFIRMED.body=Hello {{name}},\n\nWe received your payment of {{amount}} for {{className}}. Thank you.
email.PAYMENT_PENDING_REVIEW.subject=Bank slip to review: {{className}}
email.PAYMENT_PENDING_REVIEW.body=Hello {{name}},\n\n{{studentName}} uploaded a bank slip of {{amount}} for {{className}}. Open Payments on NodeMor Academy to approve or reject it.
email.PAYMENT_REJECTED.subject=Payment not accepted for {{className}}
email.PAYMENT_REJECTED.body=Hello {{name}},\n\nYour teacher could not confirm your bank slip for {{className}}.\nReason: {{reason}}\n\nUpload a clear slip again from the class page.
email.RESET_PASSWORD.subject=Reset your NodeMor Academy password
email.RESET_PASSWORD.body=Hello {{name}},\n\nOpen this link to choose a new password:\n{{link}}\n\nThe link expires in {{minutes}} minutes. If you did not ask for this, ignore this email and your password stays the same.
email.SESSION_CANCELLED.subject=Live class cancelled: {{title}}
email.SESSION_CANCELLED.body=Hello {{name}},\n\nThe live class {{title}} for {{className}} was cancelled by your teacher.
email.SESSION_SCHEDULED.subject=Live class scheduled: {{title}}
email.SESSION_SCHEDULED.body=Hello {{name}},\n\nA live class for {{className}} is scheduled.\n{{title}}\nStarts: {{start}}\n\nJoin from your class page on NodeMor Academy when it starts.
email.SESSION_STARTING.subject=Starting soon: {{title}}
email.SESSION_STARTING.body=Hello {{name}},\n\nYour live class for {{className}} starts at {{start}}. Open NodeMor Academy a few minutes early to check your audio.
email.SUBSCRIPTION_ACTIVATED.subject=Your {{plan}} plan is active
email.SUBSCRIPTION_ACTIVATED.body=Hello {{name}},\n\nThank you. Your payment of {{amount}} was received and your {{plan}} plan is active for the next 30 days.
email.TICKET_REPLIED.subject=Reply to your support request
email.TICKET_REPLIED.body=Hello {{name}},\n\nOur team replied to your request "{{subject}}". Open Support on NodeMor Academy to read it.
email.VERIFY_EMAIL.subject=Your NodeMor Academy verification code
email.VERIFY_EMAIL.body=Hello {{name}},\n\nYour verification code is: {{code}}\n\nThe code expires in {{minutes}} minutes. If you did not create an account, you can ignore this email.
