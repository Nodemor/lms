email.NEW_ASSIGNMENT.subject=புதிய ஒப்படைப்பு: {{title}}
email.NEW_ASSIGNMENT.body=வணக்கம் {{name}},\n\n{{className}} வகுப்பில் புதிய ஒப்படைப்பு வெளியிடப்பட்டுள்ளது.\n{{title}}\nகடைசித் தேதி: {{due}}
email.NEW_LESSON.subject={{className}} வகுப்பில் புதிய பாடம்
email.NEW_LESSON.body=வணக்கம் {{name}},\n\nபுதிய பதிவுசெய்யப்பட்ட பாடம் தயார்: {{title}}. NodeMor Academy இல் பார்க்கவும்.
email.NEW_MATERIAL.subject={{className}} வகுப்பில் புதிய குறிப்புகள்
email.NEW_MATERIAL.body=வணக்கம் {{name}},\n\nஉங்கள் ஆசிரியர் புதிய குறிப்புகளைச் சேர்த்துள்ளார்: {{title}}. NodeMor Academy இல் திறக்கவும்.
email.NEW_QUIZ.subject=புதிய வினாடி வினா: {{title}}
email.NEW_QUIZ.body=வணக்கம் {{name}},\n\n{{className}} வகுப்பில் புதிய வினாடி வினா உள்ளது: {{title}}.
email.PASSWORD_CHANGED.subject=உங்கள் கடவுச்சொல் மாற்றப்பட்டது
email.PASSWORD_CHANGED.body=வணக்கம் {{name}},\n\nஉங்கள் NodeMor Academy கணக்கின் கடவுச்சொல் இப்போது மாற்றப்பட்டது. மற்ற எல்லா சாதனங்களிலிருந்தும் வெளியேற்றப்பட்டது.\n\nஇதைச் செய்தது நீங்கள் இல்லை என்றால் உடனடியாகக் கடவுச்சொல்லை மீட்டமைத்து ஆதரவுக் குழுவைத் தொடர்புகொள்ளவும்.
email.PAYMENT_CONFIRMED.subject={{className}} க்கான கட்டணம் பெறப்பட்டது
email.PAYMENT_CONFIRMED.body=வணக்கம் {{name}},\n\n{{className}} க்கான உங்கள் {{amount}} கட்டணத்தைப் பெற்றோம். நன்றி.
email.PAYMENT_PENDING_REVIEW.subject=பரிசீலிக்க வங்கி ரசீது: {{className}}
email.PAYMENT_PENDING_REVIEW.body=வணக்கம் {{name}},\n\n{{studentName}} {{className}} க்காக {{amount}} வங்கி ரசீதைப் பதிவேற்றியுள்ளார். ஏற்க அல்லது நிராகரிக்க NodeMor Academy இல் கட்டணங்களைத் திறக்கவும்.
email.PAYMENT_REJECTED.subject={{className}} க்கான கட்டணம் ஏற்கப்படவில்லை
email.PAYMENT_REJECTED.body=வணக்கம் {{name}},\n\n{{className}} க்கான உங்கள் வங்கி ரசீதை உங்கள் ஆசிரியரால் உறுதிப்படுத்த முடியவில்லை.\nகாரணம்: {{reason}}\n\nவகுப்புப் பக்கத்திலிருந்து தெளிவான ரசீதை மீண்டும் பதிவேற்றவும்.
email.RESET_PASSWORD.subject=உங்கள் NodeMor Academy கடவுச்சொல்லை மீட்டமைக்கவும்
email.RESET_PASSWORD.body=வணக்கம் {{name}},\n\nபுதிய கடவுச்சொல்லைத் தேர்வுசெய்ய இந்த இணைப்பைத் திறக்கவும்:\n{{link}}\n\nஇணைப்பு {{minutes}} நிமிடங்களில் காலாவதியாகும். நீங்கள் இதைக் கோரவில்லை என்றால் இந்த மின்னஞ்சலைப் புறக்கணிக்கவும்; உங்கள் கடவுச்சொல் மாறாது.
email.SESSION_CANCELLED.subject=நேரடி வகுப்பு ரத்துசெய்யப்பட்டது: {{title}}
email.SESSION_CANCELLED.body=வணக்கம் {{name}},\n\n{{className}} வகுப்பிற்கான {{title}} நேரடி வகுப்பை உங்கள் ஆசிரியர் ரத்துசெய்துள்ளார்.
email.SESSION_SCHEDULED.subject=நேரடி வகுப்பு திட்டமிடப்பட்டது: {{title}}
email.SESSION_SCHEDULED.body=வணக்கம் {{name}},\n\n{{className}} வகுப்பிற்கு ஒரு நேரடி வகுப்பு திட்டமிடப்பட்டுள்ளது.\n{{title}}\nதொடக்கம்: {{start}}\n\nதொடங்கியதும் NodeMor Academy இல் உங்கள் வகுப்புப் பக்கத்திலிருந்து சேரவும்.
email.SESSION_STARTING.subject=விரைவில் தொடங்குகிறது: {{title}}
email.SESSION_STARTING.body=வணக்கம் {{name}},\n\n{{className}} வகுப்பிற்கான உங்கள் நேரடி வகுப்பு {{start}} மணிக்குத் தொடங்கும். உங்கள் ஒலியைச் சரிபார்க்கச் சில நிமிடங்கள் முன்பே NodeMor Academy ஐத் திறக்கவும்.
email.SUBSCRIPTION_ACTIVATED.subject=உங்கள் {{plan}} திட்டம் செயலில் உள்ளது
email.SUBSCRIPTION_ACTIVATED.body=வணக்கம் {{name}},\n\nநன்றி. உங்கள் {{amount}} கட்டணம் பெறப்பட்டது; உங்கள் {{plan}} திட்டம் அடுத்த 30 நாட்களுக்குச் செயலில் உள்ளது.
email.TICKET_REPLIED.subject=உங்கள் ஆதரவுக் கோரிக்கைக்குப் பதில்
email.TICKET_REPLIED.body=வணக்கம் {{name}},\n\nஎங்கள் குழு உங்கள் "{{subject}}" கோரிக்கைக்குப் பதிலளித்துள்ளது. படிக்க NodeMor Academy இல் ஆதரவைத் திறக்கவும்.
email.VERIFY_EMAIL.subject=உங்கள் NodeMor Academy சரிபார்ப்புக் குறியீடு
email.VERIFY_EMAIL.body=வணக்கம் {{name}},\n\nஉங்கள் சரிபார்ப்புக் குறியீடு: {{code}}\n\nஇந்தக் குறியீடு {{minutes}} நிமிடங்களில் காலாவதியாகும். நீங்கள் கணக்கை உருவாக்கவில்லை என்றால் இந்த மின்னஞ்சலைப் புறக்கணிக்கலாம்.
