# All secrets come from environment variables (see ../.env.example). Nothing secret is hard-coded.
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain
  tomcat:
    max-swallow-size: -1
    threads:
      max: ${TOMCAT_MAX_THREADS:200}

spring:
  application:
    name: nodemore-lms
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nodemore_lms}
    username: ${DB_USER:nodemore}
    password: ${DB_PASSWORD:nodemore}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}   # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

logging:
  level:
    root: INFO
    com.nodemore.lms: INFO
    org.hibernate.SQL: WARN

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  backend-url: ${BACKEND_PUBLIC_URL:http://localhost:8080}
  timezone: ${APP_TIMEZONE:Asia/Colombo}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jobs-enabled: ${APP_JOBS_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    cookie-secure: ${COOKIE_SECURE:false}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    signing-secret: ${STORAGE_SIGNING_SECRET:dev-only-change-me}
    s3-endpoint: ${S3_ENDPOINT:}
    s3-region: ${S3_REGION:auto}
    s3-bucket: ${S3_BUCKET:}
    s3-access-key: ${S3_ACCESS_KEY:}
    s3-secret-key: ${S3_SECRET_KEY:}
    max-video-mb: ${MAX_VIDEO_MB:2048}
    max-document-mb: ${MAX_DOCUMENT_MB:50}
    max-image-mb: ${MAX_IMAGE_MB:5}
  livekit:
    url: ${LIVEKIT_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
  mail:
    from: ${MAIL_FROM:NodeMor Academy <no-reply@nodemor.io>}
    reply-to: ${MAIL_REPLY_TO:nodemoracademy@gmail.com}
    class-updates: ${MAIL_CLASS_UPDATES:true}
    enabled: ${MAIL_ENABLED:true}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Super Admin}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:600}
